<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeskSort · 轻量桌面管理</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2540; --line:#26314d;
    --text:#e8ecf5; --muted:#8b96b3; --accent:#5b8cff; --accent2:#7c5bff;
    --green:#3ddc97; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%, #1b2b52 0%, var(--bg) 55%);
    color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:12px 20px;
    border-bottom:1px solid var(--line); background:rgba(22,29,46,.8); backdrop-filter:blur(8px);
  }
  .logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
  .logo .dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .search{
    flex:1;max-width:420px;display:flex;align-items:center;gap:8px;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;
  }
  .search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px}
  .search input::placeholder{color:var(--muted)}
  .spacer{flex:1}
  .badge{
    display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
    background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  }
  .badge .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);
    box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .btn{
    border:1px solid var(--line);background:var(--panel2);color:var(--text);
    border-radius:10px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}
  .btn.primary:hover{filter:brightness(1.1)}

  main{flex:1;display:flex;min-height:0}
  aside{
    width:230px;border-right:1px solid var(--line);background:rgba(22,29,46,.6);
    padding:16px 12px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;
  }
  .side-title{font-size:11px;color:var(--muted);letter-spacing:2px;padding:4px 10px 8px}
  .cat{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
    cursor:pointer;color:var(--muted);transition:.15s;user-select:none;
  }
  .cat:hover{background:var(--panel2)}
  .cat.active{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
  .cat .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .cat .name{flex:1;font-size:13.5px}
  .cat .count{font-size:11px;background:rgba(255,255,255,.06);padding:1px 8px;border-radius:999px}
  .add-cat{margin-top:auto;display:flex;gap:8px}
  .add-cat input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:7px 10px;color:var(--text);font-size:12.5px;outline:none}

  section{flex:1;padding:20px 24px;overflow-y:auto}
  .cat-block{margin-bottom:26px}
  .cat-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;user-select:none}
  .cat-head h2{font-size:15px}
  .cat-head .arrow{color:var(--muted);font-size:11px;transition:.2s}
  .cat-block.collapsed .arrow{transform:rotate(-90deg)}
  .cat-block.collapsed .grid{display:none}
  .cat-head .num{font-size:11px;color:var(--muted)}
  .cat-head .bar{flex:1;height:1px;background:var(--line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
  .icon-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 8px 12px;text-align:center;cursor:pointer;transition:.15s;position:relative;
  }
  .icon-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 20px rgba(91,140,255,.15)}
  .icon-card .glyph{
    width:46px;height:46px;margin:0 auto 10px;border-radius:13px;display:flex;
    align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.05);
  }
  .icon-card .label{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drag-over{outline:2px dashed var(--accent);outline-offset:-2px}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 0}
  .stats{display:flex;gap:14px;margin-bottom:20px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px}
  .stat .v{font-size:22px;font-weight:700}
  .stat .k{font-size:12px;color:var(--muted);margin-top:2px}
  .stat .v.green{color:var(--green)}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:9px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;
    max-width:70vw;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #modeTip{
    display:none;font-size:11px;color:var(--muted);background:rgba(255,181,71,.1);
    border:1px solid rgba(255,181,71,.35);border-radius:8px;padding:5px 10px;
  }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span>DeskSort</div>
  <div class="search">🔎<input id="search" placeholder="搜索桌面文件，回车打开第一项…"></div>
  <div class="spacer"></div>
  <span id="modeTip">预览模式 · 示例数据</span>
  <div class="badge"><span class="pulse"></span><span id="memText">轻量运行中</span></div>
  <button class="btn" id="btnScan">⟳ 重新扫描</button>
</header>

<main>
  <aside>
    <div class="side-title">全部分类</div>
    <div id="catList"></div>
    <div class="add-cat">
      <input id="newCatName" placeholder="新分类名称…">
      <button class="btn" id="btnAddCat" style="padding:7px 11px">＋</button>
    </div>
  </aside>
  <section>
    <div class="stats">
      <div class="stat"><div class="v" id="stTotal">0</div><div class="k">桌面项目总数</div></div>
      <div class="stat"><div class="v" id="stCats">0</div><div class="k">分类数量</div></div>
      <div class="stat"><div class="v green">低</div><div class="k">内存占用（Tauri 空载约 10–30 MB）</div></div>
    </div>
    <div id="board"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const isTauri = !!(window.__TAURI__ && window.__TAURI__.core);
const invoke = isTauri ? window.__TAURI__.core.invoke : null;

const PALETTE = ["#5b8cff","#7c5bff","#3ddc97","#ffb547","#ff6b9d","#4dd0e1","#ff8a65","#a1887f"];
let cats = [];
let icons = [];
let activeCat = "all";
let collapsed = new Set();
let query = "";
let nextId = 1;

const $ = s => document.querySelector(s);

async function loadData(){
  if(isTauri){
    const [c, items] = await invoke("scan_desktop");
    cats = c;
    icons = items.map((it, i)=>({ id: i+1, name: it.name, path: it.path,
      glyph: it.glyph, cat: it.cat }));
    $("#memText").textContent = "已连接本机桌面";
  }else{
    $("#modeTip").style.display = "inline-block";
    $("#memText").textContent = "预览模式";
    cats = [
      {id:"c0", name:"工作文档", color:"#5b8cff"},
      {id:"c1", name:"图片",     color:"#3ddc97"},
      {id:"c2", name:"影音娱乐", color:"#ff6b9d"},
      {id:"c3", name:"应用程序", color:"#7c5bff"},
      {id:"c4", name:"压缩包",   color:"#ffb547"},
      {id:"c5", name:"其他",     color:"#4dd0e1"},
    ];
    const demo = [
      ["年度报告.pdf","📕","c0"],["会议纪要.txt","📄","c0"],["数据表.xlsx","📊","c0"],
      ["截图 2026.png","🖼️","c1"],["头像.webp","🖼️","c1"],
      ["电影合集.mp4","🎬","c2"],["歌单.mp3","🎵","c2"],
      ["Chrome.lnk","🔗","c3"],["微信.lnk","🔗","c3"],["Steam.exe","⚙️","c3"],
      ["资料备份.zip","📦","c4"],
      ["项目文件夹","📁","c5"],["待整理.txt","📄","c5"],
    ];
    icons = demo.map(([name,glyph,cat],i)=>({id:i+1, name, path:name, glyph, cat}));
  }
  render();
}

function renderSidebar(){
  const list = [{id:"all",name:"全部项目",color:"#e8ecf5"},...cats];
  $("#catList").innerHTML = list.map(c=>`
    <div class="cat ${c.id===activeCat?'active':''}" data-id="${c.id}">
      <span class="sw" style="background:${c.color}"></span>
      <span class="name">${c.name}</span>
      <span class="count">${c.id==='all'?icons.length:icons.filter(i=>i.cat===c.id).length}</span>
    </div>`).join("");
  document.querySelectorAll(".cat").forEach(el=>{
    el.onclick = ()=>{ activeCat = el.dataset.id; render(); };
  });
}

function renderBoard(){
  const show = cats.filter(c=>activeCat==="all"||c.id===activeCat);
  $("#board").innerHTML = show.map(c=>{
    const items = icons.filter(i=>i.cat===c.id && (!query || i.name.toLowerCase().includes(query)));
    return `
    <div class="cat-block ${collapsed.has(c.id)?'collapsed':''}" data-cat="${c.id}">
      <div class="cat-head" data-toggle="${c.id}">
        <span class="arrow">▼</span>
        <span class="sw" style="width:10px;height:10px;border-radius:3px;background:${c.color};display:inline-block"></span>
        <h2>${c.name}</h2><span class="num">${items.length} 项</span><span class="bar"></span>
      </div>
      <div class="grid" data-drop="${c.id}">
        ${items.map(i=>`
          <div class="icon-card" draggable="true" data-id="${i.id}" title="${i.path}">
            <div class="glyph">${i.glyph}</div>
            <div class="label">${i.name}</div>
          </div>`).join("")}
        ${items.length===0?'<div class="empty" style="grid-column:1/-1">该分类下暂无匹配项</div>':''}
      </div>
    </div>`;
  }).join("") || '<div class="empty">桌面是空的，或扫描未获取到内容</div>';

  document.querySelectorAll("[data-toggle]").forEach(el=>{
    el.onclick = ()=>{ const id=el.dataset.toggle;
      collapsed.has(id)?collapsed.delete(id):collapsed.add(id); renderBoard(); };
  });

  document.querySelectorAll(".icon-card").forEach(card=>{
    card.onclick = async ()=>{
      const item = icons.find(i=>i.id==card.dataset.id);
      if(!item) return;
      if(isTauri){
        try{ await invoke("launch", { path: item.path }); }
        catch(e){ toast("打开失败：" + e); }
      }else{
        toast("预览模式：" + item.name);
      }
    };
  });

  let dragId = null;
  document.querySelectorAll(".icon-card").forEach(card=>{
    card.addEventListener("dragstart", e=>{ dragId = +card.dataset.id; e.dataTransfer.effectAllowed="move"; });
    card.addEventListener("dragend", ()=>document.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over")));
  });
  document.querySelectorAll("[data-drop]").forEach(zone=>{
    zone.addEventListener("dragover", e=>{ e.preventDefault(); zone.classList.add("drag-over"); });
    zone.addEventListener("dragleave", ()=>zone.classList.remove("drag-over"));
    zone.addEventListener("drop", async e=>{
      e.preventDefault(); zone.classList.remove("drag-over");
      const item = icons.find(i=>i.id===dragId);
      if(item && item.cat!==zone.dataset.drop){
        item.cat = zone.dataset.drop;
        if(isTauri){
          try{ await invoke("set_category", { path: item.path, cat: zone.dataset.drop }); }
          catch(_){}
        }
        const c = cats.find(x=>x.id===zone.dataset.drop);
        toast(`已归入「${c?c.name:zone.dataset.drop}」`); render();
      }
    });
  });
}

function renderStats(){
  $("#stTotal").textContent = icons.length;
  $("#stCats").textContent = cats.length;
}
function render(){ renderSidebar(); renderBoard(); renderStats(); }

$("#btnScan").onclick = async ()=>{
  toast(isTauri ? "正在扫描桌面…" : "预览模式：重新载入示例数据");
  await loadData();
  toast("扫描完成");
};

$("#btnAddCat").onclick = async ()=>{
  const name = $("#newCatName").value.trim();
  if(!name) return toast("请输入分类名称");
  if(isTauri){
    try{
      const c = await invoke("add_category", { name });
      cats.push(c);
    }catch(e){ return toast("创建失败：" + e); }
  }else{
    cats.push({id:"c"+Date.now(), name, color:PALETTE[cats.length % PALETTE.length]});
  }
  $("#newCatName").value = "";
  toast(`已创建分类「${name}」`); render();
};

$("#search").addEventListener("input", e=>{ query = e.target.value.trim().toLowerCase(); renderBoard(); });
$("#search").addEventListener("keydown", async e=>{
  if(e.key==="Enter"){
    const hit = icons.find(i=>i.name.toLowerCase().includes(query));
    if(!hit) return;
    if(isTauri){ try{ await invoke("launch", { path: hit.path }); }catch(err){ toast("打开失败：" + err); } }
    else toast("预览模式：" + hit.name);
  }
});

let toastTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}

loadData();
</script>
</body>
</html>
