[package]
name = "desksort"
version = "0.1.0"
description = "DeskSort - 轻量桌面管理工具"
authors = ["DeskSort"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
